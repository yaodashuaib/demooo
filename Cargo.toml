[workspace]
resolver = "2"
members = [
    "crates/d50-protocol",
    "crates/d50-hid",
    "crates/approval-core",
    "crates/bridge-ipc",
    "apps/agent-bridge-service",
    "apps/d50-hook",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
uuid = { version = "1", features = ["serde", "v4"] }
d50-protocol = { path = "crates/d50-protocol" }
d50-hid = { path = "crates/d50-hid" }
approval-core = { path = "crates/approval-core" }
bridge-ipc = { path = "crates/bridge-ipc" }
